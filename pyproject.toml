[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omero-microscope-qc"
dynamic = ["version"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name="James Grimshaw", email="james.grimshaw@ncl.ac.uk" },
  { name="Nick Bailey", email="nick.bailey2@ncl.ac.uk" },
  { name="George Merces", email="george.merces@ncl.ac.uk" }
]
description = "Used for running batch processing of microscope Quality Control images using MetroloJ and Omero"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
	"omero-py",
	"networkx",
	"pandas",
	"click",
	"xarray"
]
[project.optional-dependencies]
imagej = [
  "pyimagej"
]
nanoimagingpack = [
  "NanoImagingPack>=2.1.5"
]
all = [
  "pyimagej",
  "NanoImagingPack>=2.1.5"
]
[project.scripts]
feets-db-integration = "omero_microscope_qc.feets_db_integration:main"

[tool.setuptools]
packages = ["omero_microscope_qc"]
[tool.setuptools_scm]
[project.urls]
Homepage = "https://github.com/NCL-ImageAnalysis/Omero_Microscope_QC"
Documentation = "https://omero-microscope-qc.readthedocs.io/en/latest/index.html"
Issues = "https://github.com/NCL-ImageAnalysis/Omero_Microscope_QC/issues"